name: Source and configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_release.py
      - run: python tools/setup.py --check --with-bot
      - run: python -m unittest discover -s tests -v
